# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mokhles"
BBFILE_PATTERN_meta-mokhles = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mokhles = "6"

LAYERDEPENDS_meta-mokhles = "core"
LAYERSERIES_COMPAT_meta-mokhles = "wrynose"
